<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WFRP 4e Currency Toolbox</title>
<style>
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    padding: 20px; 
    background-color: #1e1e1e; 
    color: #f1f1f1;
    display: flex;
    justify-content: center;
  }
  .dashboard { 
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    max-width: 900px;
    width: 100%;
  }
  @media (max-width: 768px) {
    .dashboard { grid-template-columns: 1fr; }
  }
  .panel { 
    background: #2b2b2b; 
    padding: 20px; 
    border-radius: 10px; 
    box-shadow: 0 4px 8px rgba(0,0,0,0.5); 
    border: 1px solid #444;
  }
  h2 { color: #e0c068; text-align: center; margin-top: 0; grid-column: 1 / -1; margin-bottom: 0;}
  h3 { color: #ccc; border-bottom: 1px solid #555; padding-bottom: 10px; margin-top: 0; font-size: 1.2em; }
  
  .coin-row { display: flex; gap: 10px; margin-bottom: 15px; }
  .input-group { flex: 1; text-align: center; }
  label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9em; }
  .gold-label { color: #e0c068; }
  .silver-label { color: #c0c0c0; }
  .brass-label { color: #cd7f32; }
  
  input { 
    width: 100%; padding: 10px; box-sizing: border-box; 
    border: 1px solid #444; border-radius: 5px; 
    background-color: #111; color: #fff; text-align: center; font-size: 16px;
  }
  input:focus { outline: none; border-color: #e0c068; }

  button {
    width: 100%; padding: 12px; font-size: 16px; font-weight: bold;
    border: none; border-radius: 5px; cursor: pointer; color: white;
    transition: background 0.2s; margin-top: 10px;
  }
  .btn-calc { background-color: #1976d2; }
  .btn-calc:hover { background-color: #1565c0; }
  .btn-add { background-color: #2e7d32; flex: 1; margin-top: 0;}
  .btn-add:hover { background-color: #1b5e20; }
  .btn-sub { background-color: #c62828; flex: 1; margin-top: 0;}
  .btn-sub:hover { background-color: #b71c1c; }
  
  .btn-row { display: flex; gap: 10px; margin-top: 15px; }

  .result-box {
    margin-top: 15px; padding: 15px; background: #1a1a1a; 
    border-radius: 5px; text-align: center; border-left: 4px solid #e0c068;
  }
  .highlight { color: #e0c068; font-weight: bold; font-size: 1.2em; margin: 5px 0;}
  .encumbrance { color: #ff9800; font-weight: bold; margin-top: 10px; font-size: 1.1em;}
  .error-msg { color: #ff5252; text-align: center; margin-top: 10px; font-weight: bold; min-height: 20px;}
</style>
</head>
<body>

<div class="dashboard">
  <h2>WFRP 4e Currency Toolbox</h2>

  <div class="panel">
    <h3>1. The Active Purse</h3>
    <div class="coin-row">
      <div class="input-group">
        <label class="gold-label">Gold</label>
        <input type="number" id="p-gold" value="0" min="0" onchange="updateEncumbrance()">
      </div>
      <div class="input-group">
        <label class="silver-label">Silver</label>
        <input type="number" id="p-silver" value="0" min="0" onchange="updateEncumbrance()">
      </div>
      <div class="input-group">
        <label class="brass-label">Brass</label>
        <input type="number" id="p-brass" value="0" min="0" onchange="updateEncumbrance()">
      </div>
    </div>
    <div class="encumbrance" id="enc-display">Weight: 0 Encumbrance</div>
    
    <hr style="border-color: #444; margin: 20px 0;">
    
    <label style="text-align: center; margin-bottom: 10px; color:#aaa;">Transaction (Cost or Loot)</label>
    <div class="coin-row">
      <div class="input-group">
        <input type="number" id="t-gold" value="0" min="0" placeholder="gc">
      </div>
      <div class="input-group">
        <input type="number" id="t-silver" value="0" min="0" placeholder="s">
      </div>
      <div class="input-group">
        <input type="number" id="t-brass" value="0" min="0" placeholder="p">
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-add" onclick="processTransaction('add')">➕ Add</button>
      <button class="btn-sub" onclick="processTransaction('sub')">➖ Pay</button>
    </div>
    <div class="error-msg" id="error-msg"></div>
  </div>

  <div class="panel">
    <h3>2. Quick Converter</h3>
    <p style="font-size: 0.9em; color: #aaa; margin-top: 0;">Calculate loose change without altering your purse.</p>
    <div class="coin-row">
      <div class="input-group">
        <label class="gold-label">Gold</label>
        <input type="number" id="q-gold" value="0" min="0">
      </div>
      <div class="input-group">
        <label class="silver-label">Silver</label>
        <input type="number" id="q-silver" value="0" min="0">
      </div>
      <div class="input-group">
        <label class="brass-label">Brass</label>
        <input type="number" id="q-brass" value="0" min="0">
      </div>
    </div>
    <button class="btn-calc" onclick="quickConvert()">Convert to Optimal</button>
    <div class="result-box" id="q-result">
      <p>Total Value: 0 p</p>
      <p class="highlight">0 gc, 0 s, 0 p</p>
    </div>
  </div>

  <div class="panel" style="grid-column: 1 / -1;">
    <h3>3. Party Loot Splitter</h3>
    <div class="coin-row">
      <div class="input-group">
        <label class="gold-label">Total Gold</label>
        <input type="number" id="s-gold" value="0" min="0">
      </div>
      <div class="input-group">
        <label class="silver-label">Total Silver</label>
        <input type="number" id="s-silver" value="0" min="0">
      </div>
      <div class="input-group">
        <label class="brass-label">Total Brass</label>
        <input type="number" id="s-brass" value="0" min="0">
      </div>
      <div class="input-group">
        <label style="color: #fff;">Party Size</label>
        <input type="number" id="s-party" value="4" min="1">
      </div>
    </div>
    <button class="btn-calc" onclick="splitLoot()">Split Loot</button>
    <div class="result-box" id="s-result" style="display: flex; justify-content: space-around;">
      <div>
        <p style="color: #aaa; margin: 0;">Each Player Receives:</p>
        <p class="highlight">0 gc, 0 s, 0 p</p>
      </div>
      <div style="border-left: 1px solid #444; padding-left: 20px;">
        <p style="color: #aaa; margin: 0;">Remainder (Group Fund):</p>
        <p class="highlight">0 p</p>
      </div>
    </div>
  </div>

</div>

<script>
  // Universal helpers
  function getVal(id) { return parseInt(document.getElementById(id).value) || 0; }
  function toBrass(g, s, b) { return (g * 240) + (s * 12) + b; }
  function optimalCoins(totalBrass) {
    let g = Math.floor(totalBrass / 240);
    let rem = totalBrass % 240;
    let s = Math.floor(rem / 12);
    let b = rem % 12;
    return { g, s, b };
  }

  // Panel 1: Purse & Encumbrance (50 coins = 1 Enc)
  function updateEncumbrance() {
    let g = getVal('p-gold'), s = getVal('p-silver'), b = getVal('p-brass');
    let totalCoins = g + s + b;
    let enc = (totalCoins / 50).toFixed(1);
    document.getElementById('enc-display').innerText = `Weight: ${enc} Encumbrance`;
  }

  function processTransaction(type) {
    let errorDiv = document.getElementById('error-msg');
    errorDiv.innerText = ""; 

    let currentBrass = toBrass(getVal('p-gold'), getVal('p-silver'), getVal('p-brass'));
    let transBrass = toBrass(getVal('t-gold'), getVal('t-silver'), getVal('t-brass'));

    let newBrassTotal = type === 'add' ? currentBrass + transBrass : currentBrass - transBrass;

    if (newBrassTotal < 0) {
      errorDiv.innerText = "Not enough funds!";
      return;
    }

    let opt = optimalCoins(newBrassTotal);
    document.getElementById('p-gold').value = opt.g;
    document.getElementById('p-silver').value = opt.s;
    document.getElementById('p-brass').value = opt.b;

    document.getElementById('t-gold').value = 0;
    document.getElementById('t-silver').value = 0;
    document.getElementById('t-brass').value = 0;
    
    updateEncumbrance();
  }

  // Panel 2: Quick Converter
  function quickConvert() {
    let totalBrass = toBrass(getVal('q-gold'), getVal('q-silver'), getVal('q-brass'));
    let opt = optimalCoins(totalBrass);
    document.getElementById('q-result').innerHTML = `
      <p>Total Value: ${totalBrass} p</p>
      <p class="highlight">${opt.g} gc, ${opt.s} s, ${opt.b} p</p>
    `;
  }

  // Panel 3: Loot Splitter
  function splitLoot() {
    let totalBrass = toBrass(getVal('s-gold'), getVal('s-silver'), getVal('s-brass'));
    let partySize = getVal('s-party');
    
    if (partySize < 1) partySize = 1;

    let brassPerPerson = Math.floor(totalBrass / partySize);
    let remainderBrass = totalBrass % partySize;

    let opt = optimalCoins(brassPerPerson);

    document.getElementById('s-result').innerHTML = `
      <div>
        <p style="color: #aaa; margin: 0;">Each Player Receives:</p>
        <p class="highlight">${opt.g} gc, ${opt.s} s, ${opt.b} p</p>
      </div>
      <div style="border-left: 1px solid #444; padding-left: 20px;">
        <p style="color: #aaa; margin: 0;">Remainder (Group Fund):</p>
        <p class="highlight">${remainderBrass} p</p>
      </div>
    `;
  }
</script>
</body>
</html>
